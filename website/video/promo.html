<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Arcade · 30-second film</title>
<!--
  The 30-second Agent Arcade film. render.mjs loads this page in headless Chrome and calls window.seek(t) for every
  frame (30 fps); everything on screen is a pure function of t, so frames never drift. ?format=16x9 (1920x1080) or
  9x16 (1080x1920). The cockpit and phone are the website's own module (../site/assets/js/cockpit.js).
  Story: "Your agents, in your pocket". Shots sit on 2-second bars of the 120 BPM soundtrack (music.py).
-->
<link rel="stylesheet" href="../site/assets/css/cockpit.css">
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url(../site/assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url(../site/assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url(../site/assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 400; src: url(../site/assets/fonts/source-serif-4-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 500; src: url(../site/assets/fonts/source-serif-4-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Cascadia Mono"; font-weight: 400; src: url(../site/assets/fonts/cascadia-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Cascadia Mono"; font-weight: 600; src: url(../site/assets/fonts/cascadia-mono-latin-600-normal.woff2) format("woff2"); }
:root { --bg: #0c0c0e; --text: #ececf1; --muted: #9a9aa6; --faint: #63636f; --accent: #e07a5f; --accent-2: #f0a080;
  --orange: #f08a3c; --red: #f26b6b; --green: #3ecf7f; --amber: #f2b84b; --indigo: #0e0838;
  --grad: linear-gradient(100deg, #ffd43b, #ff3d9a 30%, #b425ff 55%, #4b3bff 78%, #1fb8ff);
  --serif: "Source Serif 4", Georgia, serif; --sans: Inter, "Segoe UI", sans-serif; --mono: "Cascadia Mono", Consolas, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(60% 50% at 50% 45%, rgba(224,122,95,.07), transparent 70%), var(--bg); }
.layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
#ckBox { }
#phBox { }
.ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 4px solid rgba(236,236,241,.9); pointer-events: none; }
#cap { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; text-align: center; display: grid; justify-items: center; gap: 8px; }
#cap .plate { background: rgba(12,12,14,.78); border: 1px solid rgba(50,50,59,.8); border-radius: 18px; padding: 16px 28px; backdrop-filter: blur(6px); display: grid; justify-items: center; gap: 4px; }
#cap .l1, #cap .l2 { font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
#cap .l2.red { color: var(--red); }
#cap .sm { font-weight: 500; color: var(--muted); }
#cap .brand { display: flex; align-items: center; gap: .4em; }
#cap .brand img { width: 1.25em; height: 1.25em; border-radius: .28em; }
.glint { position: absolute; inset: -20%; background: linear-gradient(115deg, transparent 35%, rgba(255,212,59,.0) 40%, rgba(255,61,154,.35) 47%, rgba(180,37,255,.35) 52%, rgba(31,184,255,.0) 60%, transparent 65%); pointer-events: none; mix-blend-mode: screen; }
/* monitor */
#mon svg { overflow: visible; }
#mon .lbl { font: 600 22px var(--mono); fill: #9a9aa6; letter-spacing: .06em; }
/* link diagram */
#diag { display: flex; align-items: center; justify-content: center; gap: 0; }
#diag .node { display: grid; justify-items: center; gap: 18px; font: 500 30px var(--sans); color: var(--muted); }
#diag .node svg { width: 150px; height: 150px; color: var(--text); }
#diag .line { position: relative; width: 640px; height: 6px; margin: 0 40px 60px; }
#diag .line i { position: absolute; left: 0; top: 0; height: 6px; background: var(--accent); border-radius: 3px; }
#diag .line span { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); font: 600 30px var(--mono); color: var(--accent-2); white-space: nowrap; }
#diag .cloud { position: absolute; left: 50%; bottom: 40px; width: 150px; margin-left: -75px; color: #63636f; }
#diag .cloud svg { width: 150px; height: 150px; }
#diag .cloud b { position: absolute; left: -10px; top: 50%; height: 7px; background: var(--red); border-radius: 4px; transform-origin: 0 50%; transform: rotate(-24deg); }
#diag .qr { position: absolute; width: 70px; height: 70px; border-radius: 10px; background:
  conic-gradient(from 90deg at 30% 30%, #ececf1 25%, transparent 0) 0 0/20px 20px, #1a1a1f; border: 6px solid #ececf1; }
/* voice */
#voice { display: grid; gap: 34px; justify-items: center; }
#voice .vpane { width: 1400px; background: #0f0f12; border: 1px solid #25252c; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.6); }
#voice .vph { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #141418; border-bottom: 1px solid #25252c; font: 600 24px var(--sans); }
#voice .vph .mg { font: 600 17px var(--mono); padding: 3px 8px; border-radius: 7px; background: #1a1a1f; color: #9a9aa6; }
#voice .vph .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
#voice .vtm { padding: 26px 30px; font: 28px/1.55 var(--mono); color: #c9c9d3; min-height: 230px; white-space: pre-wrap; }
#voice .vtm .p { color: #9a9aa6; }
#voice .vtm .cur { display: inline-block; width: .55em; height: 1.1em; background: #ececf1; vertical-align: -.2em; }
#voice .row { display: flex; align-items: center; gap: 36px; }
#voice .keys { display: flex; gap: 14px; }
#voice .key { font: 600 30px var(--mono); padding: 14px 22px; border-radius: 14px; background: #1a1a1f; border: 2px solid #32323b; border-bottom-width: 6px; color: #ececf1; }
#voice .key.down { transform: translateY(4px); border-bottom-width: 2px; background: #25252c; border-color: var(--accent); }
#voice .mic { width: 104px; height: 104px; border-radius: 50%; background: #1f1f25; border: 2px solid #32323b; display: grid; place-items: center; position: relative; }
#voice .mic svg { width: 46px; height: 46px; color: #ececf1; }
#voice .mic .halo { position: absolute; inset: -14px; border-radius: 50%; border: 6px solid rgba(242,107,107,.0); }
#voice .timer { font: 600 26px var(--mono); padding: 8px 16px; border-radius: 999px; background: rgba(242,107,107,.14); color: var(--red); }
#voice .bubble { max-width: 1300px; font: 30px/1.5 var(--mono); color: #9a9aa6; background: #141418; border: 1px solid #25252c; border-radius: 22px; padding: 22px 28px; }
#voice .bubble s { text-decoration-thickness: 3px; text-decoration-color: var(--red); }
#voice .bubble .fx { color: var(--green); }
#voice .pill { font: 600 24px var(--sans); padding: 8px 18px; border-radius: 999px; background: linear-gradient(#1a1a1f,#1a1a1f) padding-box, var(--grad) border-box; border: 2px solid transparent; }
.spin { width: 40px; height: 40px; border-radius: 50%; border: 5px solid rgba(143,180,255,.25); border-top-color: #8fb4ff; }
/* offer */
#offer { display: flex; gap: 40px; }
#offer .card { width: 560px; background: #141418; border: 1px solid #25252c; border-radius: 26px; padding: 40px 42px; display: grid; gap: 16px; box-shadow: 0 30px 70px rgba(0,0,0,.6); }
#offer .card.pro { background: linear-gradient(#141418,#141418) padding-box, var(--grad) border-box; border: 2px solid transparent; }
#offer .eb { font: 600 22px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: #9a9aa6; display: flex; align-items: center; gap: 14px; }
#offer .big { font: 400 72px/1 var(--serif); }
#offer .sub { font: 500 28px/1.4 var(--sans); color: #9a9aa6; }
#offer .tag { font: 600 20px var(--sans); padding: 5px 12px; border-radius: 999px; background: rgba(224,122,95,.16); color: var(--accent-2); text-transform: none; letter-spacing: 0; }
#offer .foot { position: absolute; left: 0; right: 0; text-align: center; font: 500 24px var(--sans); color: #9a9aa6; }
/* end card */
#end { position: absolute; inset: 0; background: radial-gradient(50% 45% at 50% 42%, #1b1160, var(--indigo) 70%); display: grid; place-items: center; }
#end .in { display: grid; justify-items: center; text-align: center; }
#end .logo { position: relative; }
#end .logo::before { content: ""; position: absolute; inset: -18%; border-radius: 30%; background: var(--grad); filter: blur(70px); opacity: .45; }
#end .logo img { position: relative; display: block; border-radius: 22%; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
#end .name { font: 600 92px/1 var(--sans); letter-spacing: -.02em; }
#end .tag { font: 400 60px/1.1 var(--serif); color: #ececf1; }
#end .url { font: 600 32px var(--mono); color: #f0a080; }
#end .free { font: 500 28px var(--sans); color: #c9c6e8; }
#end .chips { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#end .chips span { font: 500 22px var(--sans); padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #d6d4ea; }
#end .disc { position: absolute; left: 0; right: 0; text-align: center; font: 400 21px var(--sans); color: rgba(214,212,234,.6); padding: 0 60px; }
.legend { display: flex; gap: 34px; font: 500 26px var(--sans); color: #9a9aa6; }
.legend span { display: inline-flex; align-items: center; gap: 12px; }
.legend i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
#addchip { font: 500 26px var(--sans); padding: 10px 22px; border-radius: 999px; border: 2px dashed #32323b; color: #9a9aa6; background: rgba(12,12,14,.8); }
</style>
</head>
<body>
<div id="stage">
  <div id="mon" class="layer"><svg id="monSvg"></svg></div>
  <svg id="path" class="layer" style="overflow:visible"></svg>
  <div id="ckBox" class="layer"></div>
  <div id="legend" class="layer legend"><span><i style="background:#f08a3c"></i>working</span><span><i style="background:#f26b6b"></i>needs you</span><span><i style="background:#3ecf7f"></i>done</span></div>
  <div id="addchip" class="layer">+ any CLI agent</div>
  <div id="phBox" class="layer"></div>
  <div id="diag" class="layer"></div>

  <div class="ripple" id="rip"></div>
  <div class="glint" id="glint"></div>
  <div id="cap"></div>
</div>
<script src="../site/assets/js/cockpit.js"></script>
<script>
(function () {
  'use strict';
  var P = AACockpit, ease = P.ease, easeOut = P.easeOut, prog = P.prog, lerp = P.lerp, clamp = P.clamp;
  var fmt = (new URLSearchParams(location.search).get('format')) || '16x9';
  var V = fmt === '9x16';
  var W = V ? 1080 : 1920, H = V ? 1920 : 1080;
  var $ = function (id) { return document.getElementById(id); };
  var URL_TEXT = 'github.com/danular/AgentArcade';

  // Format-specific geometry. Vertical keeps the top 14% and bottom 20% clear of key content.
  var G = V ? {
    ckW: 1040, ckFont: 15, ckC: [540, 720], ckFull: 1,
    monS: 0.66, monC: [540, 640], monUp: [540, 330, 0.4], phoneFont: 25, phoneC: [540, 880], phoneSideC: [540, 1010], phoneSideS: 0.72,
    splitCk: [540, 470, 1], splitPh: [540, 1110, 0.5], capY: 1440, capSize: 58, capSm: 34,
    diagS: 0.8, diagC: [540, 800], voiceS: 0.68, voiceC: [540, 780], offerVertical: true, offerS: 0.9, offerC: [540, 800],
    endLogo: 300
  } : {
    ckW: 1500, ckFont: 19.5, ckC: [960, 462], ckFull: 1,
    monS: 0.42, monC: [560, 480], phoneFont: 22, phoneC: [1380, 520], phoneSideC: [1380, 520], phoneSideS: 1,
    splitCk: [640, 470, 0.62], splitPh: [1480, 500, 0.82], capY: 975, capSize: 54, capSm: 32,
    diagS: 1, diagC: [960, 470], voiceS: 1, voiceC: [960, 470], offerVertical: false, offerS: 1, offerC: [960, 470],
    endLogo: 260
  };

  // ---- Build -------------------------------------------------------------------------------------------------
  var ckBox = $('ckBox');
  ckBox.style.width = G.ckW + 'px'; ckBox.style.fontSize = G.ckFont + 'px';
  var ck = P.create(ckBox, { logo: '../site/assets/img/icon-64.png', sidebar: !V });
  var phBox = $('phBox');
  phBox.style.fontSize = G.phoneFont + 'px';
  var ph = P.createPhone(phBox);

  // Monitor line-art around the shrunken cockpit, with its PC name.
  var ckH = G.ckW * 9.4 / 16;
  var monSvg = $('monSvg');
  var mw = G.ckW + 80, mh = ckH + 80;
  monSvg.setAttribute('width', mw); monSvg.setAttribute('height', mh + 260); monSvg.setAttribute('viewBox', '0 0 ' + mw + ' ' + (mh + 260));
  monSvg.innerHTML = '<rect x="4" y="4" width="' + (mw - 8) + '" height="' + (mh - 8) + '" rx="34" fill="#111114" stroke="#9a9aa6" stroke-width="8"/>' +
    '<path d="M' + (mw / 2) + ' ' + mh + 'v110M' + (mw / 2 - 170) + ' ' + (mh + 116) + 'h340" stroke="#9a9aa6" stroke-width="10" stroke-linecap="round"/>' +
    '<text class="lbl" x="' + (mw / 2) + '" y="' + (mh + 210) + '" text-anchor="middle" style="font-size:' + (V ? 40 : 46) + 'px">DESKTOP-ARCADE</text>';
  $('mon').style.width = mw + 'px';

  // Dotted path from the monitor off-frame.
  var pathSvg = $('path');
  pathSvg.setAttribute('width', W); pathSvg.setAttribute('height', H);
  pathSvg.innerHTML = '<path id="pathD" fill="none" stroke="#e07a5f" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22"/>';

  // Direct-link diagram.
  var phoneIcon = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="14" y="4" width="20" height="40" rx="4"/><path d="M21 38h6"/></svg>';
  var pcIcon = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="8" width="40" height="26" rx="3"/><path d="M18 42h12M24 34v8"/></svg>';
  $('diag').innerHTML = '<div class="node" style="position:relative">' + phoneIcon + 'Your phone<div class="qr" style="left:-60px;top:-30px"></div></div>' +
    '<div class="line"><i id="dLine"></i><span id="dLbl">Wi-Fi or Tailscale</span><div class="cloud" id="dCloud"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 36h22a8 8 0 0 0 0-16 12 12 0 0 0-23-2A9 9 0 0 0 14 36Z"/></svg><b id="dStrike"></b></div></div>' +
    '<div class="node">' + pcIcon + 'Your PC</div>';

  // Voice scene.
  var RAW = [['Um,', 1], ['so,', 1], ['uh,', 1], ['the', 1], ['the', 0], ['conf-', 1], ['configuration', 0], ['in', 0], ['cloud code', 2], ['is,', 0], ['um…', 1], ['broken', 0], ['since', 0], ['the', 0], ['update.', 0]];
  var CLEAN = 'The configuration in Claude Code is broken since the update.';
  $('voice').innerHTML =
    '<div class="vpane"><div class="vph"><span class="dot"></span><span class="mg">CC</span>Claude Code<span style="margin-left:auto;color:#9a9aa6;font:500 20px var(--mono)">main · HimalayanExpedition</span></div>' +
    '<div class="vtm"><span class="p">&gt; </span><span id="vTyped"></span><span class="cur" id="vCur"></span></div></div>' +
    '<div class="row"><div class="keys"><span class="key" id="k1">Ctrl</span><span class="key" id="k2">Shift</span><span class="key" id="k3">Space</span></div>' +
    '<div class="mic"><div class="halo" id="vHalo"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>' +
    '<span class="timer" id="vTimer">0:00</span><div class="spin" id="vSpin"></div><span class="pill">Voice dictation · coming to Pro</span></div>' +
    '<div class="bubble" id="vBubble"></div>';

  // Offer cards.
  $('offer').innerHTML =
    '<div class="card" id="oc1"><span class="eb">Personal</span><span class="big">Free</span><span class="sub">All agents · every pane · the Android remote</span></div>' +
    '<div class="card pro" id="oc2"><span class="eb">Professional <span class="tag">for work</span></span><span class="big">Pro</span><span class="sub">A commercial licence · voice dictation coming</span></div>';
  if (G.offerVertical) $('offer').style.flexDirection = 'column';

  // End card.
  $('end').innerHTML = '<div class="in" id="endIn">' +
    '<div class="logo" id="eLogo"><img src="../site/assets/img/icon-512.png" width="' + G.endLogo + '" height="' + G.endLogo + '" alt=""></div>' +
    '<div class="name" id="eName" style="margin-top:46px">Agent Arcade</div>' +
    '<div class="tag" id="eTag" style="margin-top:18px">All your agents. One window.</div>' +
    '<div class="chips" id="eChips" style="margin-top:34px;max-width:' + (V ? 900 : 1400) + 'px"><span>Claude Code</span><span>Codex</span><span>Gemini CLI</span><span>GitHub Copilot CLI</span><span>Cursor</span></div>' +
    '<div class="free" id="eFree" style="margin-top:34px">Free for personal use · Windows 11</div>' +
    '<div class="url" id="eUrl" style="margin-top:12px">' + URL_TEXT + '</div></div>' +
    '<div class="disc" id="eDisc" style="bottom:' + (V ? 300 : 34) + 'px">Independent product, not affiliated with Anthropic, OpenAI, Google, GitHub, Microsoft, Anysphere or Tailscale.</div>';

  // ---- Captions: one timeline for the film, the SRT and the VTT -----------------------------------------------
  var CAPTIONS = [
    { a: 0.0, b: 2.0, l1: '4 agents working.', l2: '1 needs you.', l2at: 1.2, l2red: true },
    { a: 2.0, b: 4.0, brand: true, l1: 'Agent Arcade.', sm: 'Every AI coding agent, side by side on Windows.' },
    { a: 4.0, b: 6.0, l1: 'Walk away. They keep working.' },
    { a: 6.0, b: 8.0, l1: 'Needs you? Your phone knows.' },
    { a: 8.0, b: 12.0, l1: 'Read it live. Approve in one tap.' },
    { a: 12.0, b: 14.0, l1: 'Your agent carries on.' },
    { a: 14.0, b: 16.0, l1: 'Phone to PC. No Agent Arcade server.', sm: 'Paired with one QR scan.' },
    { a: 16.0, b: 20.0, l1: 'Talk, don’t type.', sm: 'Voice dictation · coming to Pro' },
    { a: 20.0, b: 22.0, l1: 'Drag to swap. Nothing restarts.' },
    { a: 22.0, b: 26.0, l1: 'Free for personal use.', sm: 'Pro for work. Voice dictation coming.' }
  ];
  window.CAPTIONS = CAPTIONS.map(function (c) { return { start: c.a, end: c.b, text: [c.l1, c.l2, c.sm].filter(Boolean).join('\n') }; })
    .concat([{ start: 26.3, end: 30.0, text: 'Agent Arcade. All your agents. One window.\n' + URL_TEXT }]);

  var cap = $('cap'), capKey = '';
  cap.style.top = 'auto';
  function caption(t) {
    var c = null;
    for (var i = 0; i < CAPTIONS.length; i++) if (t >= CAPTIONS[i].a && t < CAPTIONS[i].b) c = CAPTIONS[i];
    if (!c) { cap.style.opacity = 0; return; }
    var showL2 = c.l2 && t >= c.l2at;
    var key = c.a + '|' + showL2;
    if (key !== capKey) {
      capKey = key;
      cap.innerHTML = '<div class="plate">' +
        (c.brand ? '<div class="l1 brand" style="font-size:' + (G.capSize * 1.15) + 'px"><img src="../site/assets/img/icon-64.png" alt="">' + c.l1 + '</div>'
                 : '<div class="l1" style="font-size:' + G.capSize + 'px">' + c.l1 + '</div>') +
        (showL2 ? '<div class="l2' + (c.l2red ? ' red' : '') + '" style="font-size:' + G.capSize + 'px">' + c.l2 + '</div>' : '') +
        (c.sm ? '<div class="sm" style="font-size:' + G.capSm + 'px">' + c.sm + '</div>' : '') + '</div>';
    }
    var k = easeOut(prog(t, c.a, c.a + 0.18));
    cap.style.opacity = k * (1 - prog(t, c.b - 0.12, c.b));
    cap.style.top = (G.capY - cap.offsetHeight / 2 + (1 - k) * 18) + 'px';
    cap.style.maxWidth = (V ? 980 : 1700) + 'px';
  }

  // ---- Helpers --------------------------------------------------------------------------------------------------
  function place(el, cx, cy, s, o, w, h) {
    w = w || el.offsetWidth; h = h || el.offsetHeight;
    el.style.transform = 'translate(' + (cx - w / 2) + 'px,' + (cy - h / 2) + 'px) scale(' + s + ')';
    el.style.opacity = o;
    el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  }
  function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
  function shake(t, at) { var d = t - at; return d >= 0 && d < 0.3 ? Math.sin(d * 140) * 10 * (1 - d / 0.3) : 0; }

  var L4 = P.layout(4), L5 = P.layout(5);
  function panes(t) {
    var join = ease(prog(t, 2.2, 2.85));
    var rect = function (i) { return P.lerpRect(L4[i] || L5[i], L5[i], join); };
    var sw = ease(prog(t, 20.3, 21.1)), lift = t >= 20.15 && t < 21.15;
    var r0 = rect(0), r4 = L5[4];
    var cxRect = sw > 0 ? P.lerpRect(r0, r4, sw) : r0;
    var cuRect = sw > 0 ? P.lerpRect(r4, L5[0], ease(prog(t, 20.9, 21.4))) : { x: r4.x, y: r4.y + (1 - join) * 0.05, w: r4.w, h: r4.h };
    var ccNeeds = t >= 1.2 && t < 12.3;
    var list = [
      { id: 'cx', rect: cxRect, status: 'working', shown: 2 + t * 0.35, secs: 40 + Math.floor(t), lift: lift },
      { id: 'cc', rect: rect(1), status: ccNeeds ? 'needs' : 'working', prompt: true, applied: t >= 12.3, shown: Math.min(4, 2 + t), secs: t < 1.2 ? 31 : 1 + Math.floor(t - 12.3) },
      { id: 'gm', rect: rect(2), status: 'working', shown: 1.5 + t * 0.3, secs: 12 + Math.floor(t) },
      { id: 'cp', rect: rect(3), status: t < 12.6 ? 'working' : 'done', shown: Math.min(6, 2 + t * 0.3), secs: 8 + Math.floor(t) }
    ];
    if (join > 0.001) list.push({ id: 'cu', rect: cuRect, opacity: join, status: 'working', shown: 1 + (t - 2.2) * 0.25, secs: 1 + Math.floor(t - 2.2), drop: lift && sw > 0.6 });
    return { panes: list };
  }

  // ---- The timeline ---------------------------------------------------------------------------------------------
  function seek(t) {
    t = clamp(t, 0, 30);
    caption(t);

    // Glint on frame 1 (a coin-blip of the brand gradient).
    var g = prog(t, 0, 0.55);
    $('glint').style.opacity = g < 1 ? 1 - g : 0;
    $('glint').style.transform = 'translateX(' + lerp(-60, 60, g) + '%)';

    // Cockpit: full (0-4), into the monitor (4-8), split (12-14), full again (20-26), folds into the logo (26-26.6).
    var full = [G.ckC[0], G.ckC[1], G.ckFull];
    var mon = [G.monC[0], G.monC[1], G.monS];
    if (G.monUp) mon = mix(mon, G.monUp, ease(prog(t, 6, 6.45)));
    var ckT, ckO = 1;
    if (t < 4) ckT = [full[0], full[1], lerp(1.035, 1, easeOut(prog(t, 0, 2))) * (1 - 0.02 * prog(t, 2, 4))];
    else if (t < 8) { ckT = mix([full[0], full[1], 0.98], mon, ease(prog(t, 4, 4.7))); ckO = 1 - prog(t, 7.9, 8.2); }
    else if (t < 12) { ckT = mon; ckO = 0; }
    else if (t < 14) { ckT = G.splitCk; ckO = easeOut(prog(t, 12, 12.3)) * (1 - prog(t, 13.85, 14.1)); }
    else if (t < 20) { ckT = full; ckO = 0; }
    else if (t < 26) { ckT = full; ckO = easeOut(prog(t, 20, 20.25)); }
    else { var f = ease(prog(t, 26, 26.6)); ckT = [full[0], lerp(full[1], H * 0.42, f), lerp(1, 0.08, f)]; ckO = 1 - prog(t, 26.35, 26.6); }
    ck.render(panes(t));
    ckBox.style.filter = t >= 22 && t < 26 ? 'blur(' + (4 * ease(prog(t, 22, 22.4))) + 'px) brightness(' + (1 - 0.45 * ease(prog(t, 22, 22.4))) + ')' : 'none';
    place(ckBox, ckT[0], ckT[1], ckT[2], ckO, G.ckW, ckH);

    // Monitor frame and the dotted path out of the frame.
    var monO = ease(prog(t, 4.25, 4.7)) * (1 - prog(t, 7.9, 8.2));
    var mS = ckT[2] * (mw / G.ckW) * (G.ckW / mw);
    place($('mon'), mon[0], mon[1] + (mh + 260 - mh) / 2 * mon[2], mon[2], t >= 4 && t < 8.2 ? monO : 0, mw, mh + 260);
    var pd = $('pathD'), pk = ease(prog(t, 4.6, 5.8));
    var sx = V ? mon[0] : mon[0] + mw * mon[2] / 2 + 30, sy = V ? mon[1] + (mh / 2 + 280) * mon[2] : mon[1];
    var ex = V ? W * 0.5 : W + 40, ey = V ? H + 40 : mon[1] - 40;
    pd.setAttribute('d', V ? 'M' + sx + ' ' + sy + ' C ' + (sx + 260) + ' ' + (sy + 200) + ', ' + (sx - 260) + ' ' + (sy + 380) + ', ' + ex + ' ' + ey
                           : 'M' + sx + ' ' + sy + ' C ' + (sx + 260) + ' ' + (sy - 120) + ', ' + (sx + 520) + ' ' + (sy + 160) + ', ' + ex + ' ' + ey);
    var len = 1600;
    pd.style.strokeDasharray = '2 22';
    pathSvg.style.opacity = t >= 4.5 && t < 6.6 ? 1 - prog(t, 6.2, 6.6) : 0;
    pathSvg.style.clipPath = 'inset(0 ' + (V ? 0 : (1 - pk) * 100) + '% ' + (V ? (1 - pk) * 100 : 0) + '% 0)';

    // Phone: slides up and buzzes (6-8), chat and approval (8-12), split (12-14).
    var phT = null, phO = 0;
    var phS = { status: 'needs', ask: 0, pressed: false, applied: false, alert: 0 };
    if (t >= 6 && t < 8) {
      var up = easeOut(prog(t, 6, 6.45));
      var sideC = V ? [G.phoneSideC[0], G.phoneSideC[1]] : G.phoneSideC;
      phT = [sideC[0] + shake(t, 6.0) + shake(t, 6.4), lerp(H + 600, sideC[1], up), V ? G.phoneSideS : 1]; phO = 1;
      phS.alert = easeOut(prog(t, 6.15, 6.45));
    } else if (t >= 8 && t < 12) {
      var mv = ease(prog(t, 8, 8.5));
      var from = V ? [G.phoneSideC[0], G.phoneSideC[1], G.phoneSideS] : [G.phoneSideC[0], G.phoneSideC[1], 1];
      var to = V ? [G.phoneC[0], G.phoneC[1] - 60, 1] : [960, 478, 0.98];
      phT = mix(from, to, mv); phO = 1;
      phS.alert = 1 - prog(t, 8.0, 8.3);
      phS.ask = prog(t, 8.45, 8.8);
      phS.pressed = t >= 10.0;
      phS.applied = t >= 10.45;
      phS.status = t >= 10.45 ? 'working' : 'needs';
    } else if (t >= 12 && t < 14.1) {
      phT = G.splitPh; phO = easeOut(prog(t, 12, 12.3)) * (1 - prog(t, 13.85, 14.1));
      phS.status = 'working'; phS.applied = true; phS.ask = 0;
    }
    ph.render(phS);
    if (phT) place(phBox, phT[0], phT[1], phT[2], phO); else place(phBox, -9999, -9999, 1, 0);

    // Tap ripples: on the alert (7.6 s) and on "1 Yes" (10.0 s).
    var rip = $('rip'), rt = -1, target = null;
    if (t >= 7.6 && t < 8.1) { rt = t - 7.6; target = phBox.querySelector('.ckp-alert'); }
    if (t >= 10.0 && t < 10.5) { rt = t - 10.0; target = phBox.querySelector('[data-n="1"]'); }
    if (target && phO > 0) {
      var r = target.getBoundingClientRect();
      rip.style.left = (r.left + r.width * 0.3) + 'px'; rip.style.top = (r.top + r.height / 2) + 'px';
      rip.style.transform = 'scale(' + lerp(0.4, 1.6, easeOut(rt / 0.5)) + ')'; rip.style.opacity = 1 - rt / 0.5;
    } else rip.style.opacity = 0;

    // Legend during the payoff split.
    var lgO = easeOut(prog(t, 12.4, 12.7)) * (1 - prog(t, 13.85, 14.1));
    place($('legend'), G.splitCk[0], G.splitCk[1] + ckH * G.splitCk[2] / 2 + 50, 1, t >= 12 && t < 14.1 ? lgO : 0);

    // Direct link (14-16).
    var dO = easeOut(prog(t, 14.05, 14.35)) * (1 - prog(t, 15.85, 16.05));
    place($('diag'), G.diagC[0], G.diagC[1], G.diagS, t >= 14 && t < 16.1 ? dO : 0);
    $('dLine').style.width = (100 * ease(prog(t, 14.2, 14.8))) + '%';
    $('dLbl').style.opacity = prog(t, 14.6, 14.8);
    $('dCloud').style.opacity = prog(t, 14.5, 14.75);
    $('dStrike').style.width = (170 * ease(prog(t, 15.0, 15.25))) + 'px';

    // Voice (16-20).
    var vO = easeOut(prog(t, 16, 16.25)) * (1 - prog(t, 19.85, 20.05));
    place($('voice'), G.voiceC[0], G.voiceC[1], G.voiceS, t >= 16 && t < 20.1 ? vO : 0);
    if (t >= 16 && t < 20.1) voice(t);

    // + any CLI agent chip (20.6-22).
    var acO = easeOut(prog(t, 20.9, 21.2)) * (1 - prog(t, 21.85, 22));
    place($('addchip'), V ? 540 : 1580, V ? G.ckC[1] - ckH / 2 - 60 : 110, 1, t >= 20.9 && t < 22 ? acO : 0);

    // Offer (22-26).
    var oO = t >= 22 && t < 26.1 ? 1 - prog(t, 25.9, 26.05) : 0;
    place($('offer'), G.offerC[0], G.offerC[1], G.offerS, oO);
    ['oc1', 'oc2'].forEach(function (id, i) {
      var k = easeOut(prog(t, 22.15 + i * 0.25, 22.6 + i * 0.25));
      $(id).style.transform = 'translateY(' + ((1 - k) * 60) + 'px)'; $(id).style.opacity = k;
    });

    // End card (26-30), fully static from 28.0.
    var end = $('end'), eo = ease(prog(t, 25.95, 26.35));
    end.style.opacity = t >= 25.95 ? eo : 0;
    end.style.visibility = t >= 25.95 ? 'visible' : 'hidden';
    if (t >= 25.95) {
      var lk = easeOut(prog(t, 26.0, 26.5));
      var bob = t < 28 ? Math.sin(prog(t, 26.6, 27.4) * Math.PI * 2) * 6 * (1 - prog(t, 26.6, 27.6)) : 0;
      $('eLogo').style.transform = 'translateY(' + bob + 'px) scale(' + lerp(0.6, 1, lk) + ')';
      $('eLogo').style.opacity = lk;
      [['eName', 26.3], ['eTag', 26.8], ['eChips', 27.0], ['eFree', 27.3], ['eUrl', 27.3], ['eDisc', 27.3]].forEach(function (p) {
        var k2 = easeOut(prog(t, p[1], p[1] + 0.3));
        $(p[0]).style.opacity = k2; $(p[0]).style.transform = 'translateY(' + ((1 - k2) * 14) + 'px)';
      });
    }
  }

  var vKey = '';
  function voice(t) {
    var down = t >= 16.1 && t < 18.4;
    ['k1', 'k2', 'k3'].forEach(function (k) { $(k).classList.toggle('down', down); });
    var rec = down ? (t - 16.1) : 0;
    var halo = $('vHalo');
    halo.style.borderColor = down ? 'rgba(242,107,107,' + (0.35 + 0.35 * Math.abs(Math.sin((t - 16.1) * 5))) + ')' : 'rgba(242,107,107,0)';
    $('vTimer').textContent = '0:0' + Math.min(7, Math.floor(rec * 3.1));
    $('vTimer').style.opacity = down || (t >= 18.4 && t < 18.8) ? 1 : 0.25;
    $('vSpin').style.opacity = t >= 18.4 && t < 18.85 ? 1 : 0;
    $('vSpin').style.transform = 'rotate(' + ((t - 18.4) * 720) + 'deg)';
    // Raw words appear while talking; after release the fillers strike through and "cloud code" becomes "Claude Code".
    var words = Math.floor(clamp((t - 16.2) / 2.0, 0, 1) * RAW.length);
    var strike = t >= 18.85, fix = t >= 19.05;
    var typed = Math.floor(clamp((t - 19.1) / 0.55, 0, 1) * CLEAN.length);
    var key = words + '|' + strike + '|' + fix + '|' + typed;
    if (key !== vKey) {
      vKey = key;
      $('vBubble').innerHTML = RAW.slice(0, Math.max(1, words)).map(function (w) {
        if (w[1] === 2) return fix ? '<span class="fx">Claude Code</span>' : (strike ? '<s>cloud code</s>' : 'cloud code');
        return w[1] === 1 && strike ? '<s>' + w[0] + '</s>' : w[0];
      }).join(' ') + (words < RAW.length && t < 18.4 ? ' <span style="color:#63636f">▍</span>' : '');
      $('vTyped').textContent = CLEAN.slice(0, typed);
    }
    $('vBubble').style.opacity = t >= 16.15 ? 1 : 0;
    $('vCur').style.opacity = Math.floor(t * 2) % 2 ? 1 : 0.2;
  }

  window.seek = seek;
  document.fonts.ready.then(function () { seek(0); });
})();
</script>
</body>
