name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The page's alert rules and the golden screens: what the status dots and the phone read from each agent's
      # screen (tests/status). Named by file: current Node.js runs a folder argument as if it were a test file.
      - name: Status and alert tests
        run: node --test tests/remote.test.js tests/status/status.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained build
        run: dotnet publish AgentArcade.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Check the build has its web page
        shell: pwsh
        run: |
          foreach ($f in 'publish/AgentArcade.exe', 'publish/web/index.html', 'publish/web/vendor/xterm.js') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
      - name: Check the bundled .NET runtime is the latest (release.ps1 enforces the same)
        shell: pwsh
        run: |
          $config = Get-Content publish/AgentArcade.runtimeconfig.json -Raw | ConvertFrom-Json
          $latest = [version](Invoke-RestMethod 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json').'latest-runtime'
          foreach ($fw in $config.runtimeOptions.includedFrameworks) {
            "$($fw.name) $($fw.version) (latest $latest)"
            if ([version]$fw.version -lt $latest) { throw "$($fw.name) $($fw.version) is older than $latest" }
          }
