<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Arcade Remote mockups</title>
<!-- Design mockups for the Android app. Colors, icons and marks come from the desktop app (web/app.css, web/app.js).
     Render with tools\render-mockups.ps1; ?s=<id> shows one screen at phone size. -->
<script src="marks.js"></script>
<style>
:root {
  --bg: #0c0c0e; --side: #111114; --panel: #141418; --panel-2: #1a1a1f; --hover: #1f1f25;
  --border: #25252c; --border-2: #32323b; --text: #ececf1; --muted: #9a9aa6; --faint: #63636f;
  --accent: #e07a5f; --accent-2: #f0a080; --green: #3ecf7f; --amber: #f2b84b; --red: #f26b6b;
  --term: #0f0f12; --menu: #19191e; --sheet: #16161b;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #060607; color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
.board { display: grid; grid-template-columns: repeat(4, 412px); gap: 40px 36px; padding: 40px 44px 44px; }
figure { margin: 0; }
figcaption { margin-top: 12px; color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; }
body.single { background: var(--bg); }
body.single .board { display: block; padding: 0; }
body.single figure:not(.show), body.single figcaption { display: none; }
.phone { position: relative; display: flex; flex-direction: column; width: 412px; height: 915px; overflow: hidden; background: var(--bg); border-radius: 30px; box-shadow: 0 0 0 1px #2a2a31, 0 30px 80px rgba(0, 0, 0, .6); }
body.single .phone { border-radius: 0; box-shadow: none; }
.ellipsis { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic { display: block; flex: none; }
b { font-weight: 600; }

/* system bars */
.statusbar { display: flex; flex: none; align-items: center; justify-content: space-between; height: 32px; padding: 0 22px 0 26px; font-size: 13px; font-weight: 600; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.gesture { display: grid; flex: none; height: 22px; place-items: center; background: var(--side); }
.gesture::after { content: ''; width: 108px; height: 4px; border-radius: 2px; background: #d9d9e0; opacity: .45; }

/* shared pieces, same as the desktop */
.logo { display: grid; flex: none; place-items: center; width: 30px; height: 30px; overflow: hidden; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.logo img { display: block; width: 100%; height: 100%; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(62, 207, 127, .15); }
.dot.wait { background: var(--amber); box-shadow: 0 0 0 3px rgba(242, 184, 75, .16); }
.dot.off { background: #4a4a54; }
.dot.idle { background: #6b6b78; }
.avatar { --c: #888; display: inline-grid; flex: none; place-items: center; width: 22px; height: 22px; color: #fff; background: color-mix(in srgb, var(--c) 82%, #000); border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.avatar svg { width: 14px; height: 14px; }
.avatar.lg { width: 36px; height: 36px; border-radius: 10px; }
.avatar.lg svg { width: 22px; height: 22px; }
.count { flex: none; padding: 0 7px; font-size: 11px; line-height: 18px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 999px; }
.count.live { color: var(--green); background: rgba(62, 207, 127, .08); border-color: rgba(62, 207, 127, .35); }
.plan-tag { flex: none; padding: 0 5px; font-size: 10px; line-height: 16px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border-2); border-radius: 5px; }
.tag-btn { flex: none; padding: 2px 10px; font-size: 11.5px; font-weight: 500; color: var(--accent-2); border: 1px solid rgba(224, 122, 95, .4); border-radius: 999px; }
.primary-btn, .ghost-btn, .danger-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 16px; font-weight: 600; white-space: nowrap; border-radius: 12px; }
.primary-btn { color: #121214; background: var(--text); }
.ghost-btn { color: var(--text); background: var(--panel); border: 1px solid var(--border-2); }
.danger-btn { color: #1c0c0c; background: var(--red); }
.primary-btn.sm, .ghost-btn.sm { height: 32px; padding: 0 12px; gap: 6px; font-size: 13px; font-weight: 500; border-radius: 9px; }
.ghost-btn.xs { height: 28px; padding: 0 10px; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); border-color: var(--border); border-radius: 8px; }
.text-btn { color: var(--muted); font-weight: 500; }
.icon-btn { display: inline-grid; flex: none; place-items: center; width: 40px; height: 40px; color: var(--muted); border-radius: 10px; }

/* app bar + bottom navigation */
.appbar { display: flex; flex: none; align-items: center; gap: 10px; height: 58px; padding: 0 14px 0 16px; }
.appbar-title { font-size: 17px; font-weight: 600; }
.appbar h1 { margin: 0; font-size: 20px; font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 7px; height: 28px; margin-left: auto; padding: 0 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; }
.bottomnav { display: flex; flex: none; height: 68px; padding: 8px 8px 4px; background: var(--side); border-top: 1px solid var(--border); }
.tab { display: flex; flex: 1; flex-direction: column; align-items: center; gap: 4px; color: var(--faint); font-size: 11.5px; font-weight: 500; }
.tab .pill { display: grid; place-items: center; width: 58px; height: 30px; border-radius: 999px; }
.tab.on { color: var(--text); }
.tab.on .pill { color: var(--accent-2); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--border-2); }

/* agents list */
.content { flex: 1; min-height: 0; overflow: hidden; padding: 2px 12px 10px; }
.chips { display: flex; gap: 8px; padding: 0 2px 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 999px; }
.chip.live { color: var(--green); background: rgba(62, 207, 127, .08); border-color: rgba(62, 207, 127, .35); }
.chip.amber { color: var(--amber); background: rgba(242, 184, 75, .08); border-color: rgba(242, 184, 75, .35); }
.section-head { display: flex; align-items: center; gap: 8px; padding: 14px 6px 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
.section-head .count { margin-left: auto; }
.card { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; padding: 12px 14px 12px 13px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
.card.attention { border-color: rgba(242, 184, 75, .32); background: linear-gradient(180deg, rgba(242, 184, 75, .055), rgba(242, 184, 75, 0) 75%), var(--panel); }
.card-top { display: flex; align-items: center; gap: 9px; }
.card-title { flex: 1; font-size: 14.5px; font-weight: 600; }
.ago { flex: none; color: var(--faint); font: 11.5px var(--mono); }
.indent { padding-left: 48px; }
.card-sub { color: var(--muted); font-size: 12.5px; }
.ask { font-size: 13px; line-height: 1.4; }
.ask b { color: var(--amber); }
.said { color: var(--muted); font-size: 13px; line-height: 1.4; }
.activity { overflow: hidden; color: var(--muted); font: 12px/1.45 var(--mono); white-space: nowrap; text-overflow: ellipsis; }
.activity .sp { color: #d97757; }
.progress { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.bar { flex: 1; height: 4px; overflow: hidden; background: var(--border); border-radius: 999px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.progress span { color: var(--muted); font: 11.5px var(--mono); white-space: nowrap; }
.card-end { display: flex; align-items: center; gap: 8px; }
.card-end .card-sub { flex: 1; }

/* chat */
.chat-bar { display: flex; flex: none; align-items: center; gap: 9px; height: 60px; padding: 0 4px 0 2px; background: var(--panel); border-bottom: 1px solid var(--border); }
.chat-titles { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.chat-title { font-size: 15px; font-weight: 600; }
.chat-sub { color: var(--muted); font-size: 12px; }
.strip { display: flex; flex: none; align-items: center; gap: 8px; height: 38px; padding: 0 14px; font-size: 12.5px; background: var(--side); border-bottom: 1px solid var(--border); }
.strip .state { font-weight: 600; }
.amber-text { color: var(--amber); }
.green-text { color: var(--green); }
.strip .time { color: var(--faint); font: 11.5px var(--mono); }
.strip .plan { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font: 11.5px var(--mono); }
.strip .bar { flex: none; width: 54px; }
.planbox { flex: none; padding: 8px 14px 10px; background: var(--side); border-bottom: 1px solid var(--border); }
.plan-item { display: flex; align-items: center; gap: 9px; height: 23px; color: var(--muted); font-size: 12.5px; }
.plan-item .ic { color: var(--faint); }
.plan-item.done { color: var(--faint); }
.plan-item.done .ic { color: var(--green); }
.plan-item.now { color: var(--text); font-weight: 600; }
.plan-item.now .ic { color: var(--accent); }
.term { position: relative; display: flex; flex: 1; flex-direction: column; justify-content: flex-end; min-height: 0; overflow: hidden; padding: 10px 12px 8px; color: #e4e4e7; font: 12px/1.42 var(--mono); background: var(--term); }
.tt { white-space: pre-wrap; word-break: break-word; }
.term .k { color: #71717a; } .term .r { color: #f87171; } .term .g { color: #4ade80; } .term .y { color: #facc15; }
.term .bl { color: #60a5fa; } .term .m { color: #c084fc; } .term .c { color: #22d3ee; } .term .w { color: #fafafa; }
.term .o { color: #d97757; } .term .b { font-weight: 700; }
.term .del { background: rgba(248, 113, 113, .16); } .term .add { background: rgba(74, 222, 128, .15); }
.term .user { color: #a1a1aa; }
.jump { position: absolute; right: 14px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; color: var(--text); font-size: 12px; font-weight: 500; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 999px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.dock { flex: none; background: var(--side); border-top: 1px solid var(--border); }
.approve { margin: 10px 10px 2px; padding: 12px; background: var(--sheet); border: 1px solid rgba(242, 184, 75, .42); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.approve-head { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
.approve-q { margin: 5px 0 8px 17px; color: var(--muted); font-size: 13px; line-height: 1.4; }
.choice { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; margin-top: 6px; padding: 0 12px; font-size: 13.5px; font-weight: 500; border-radius: 10px; }
.choice.primary { color: #121214; background: var(--text); font-weight: 600; }
.choice.ghost { color: var(--text); background: var(--panel); border: 1px solid var(--border-2); }
.key { display: inline-grid; flex: none; place-items: center; width: 22px; height: 22px; font: 600 11.5px var(--mono); border-radius: 6px; }
.choice.primary .key { background: rgba(0, 0, 0, .1); }
.choice.ghost .key { color: var(--muted); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--border-2); }
.keys { display: flex; gap: 6px; padding: 9px 10px 2px; overflow: hidden; }
.kk { display: inline-grid; flex: none; place-items: center; min-width: 40px; height: 32px; padding: 0 10px; color: var(--muted); font: 12px var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; }
.field { display: flex; flex: 1; align-items: center; height: 46px; padding: 0 14px; color: var(--faint); font-size: 14px; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 14px; }
.round { display: inline-grid; flex: none; place-items: center; width: 42px; height: 42px; border-radius: 50%; }
.round.ghost { color: var(--muted); background: var(--panel); border: 1px solid var(--border); }
.round.send { width: 46px; height: 46px; color: #121214; background: var(--text); }

/* bottom sheet */
.under { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .58); backdrop-filter: blur(3px); }
.sheet { position: absolute; right: 0; bottom: 0; left: 0; padding: 8px 14px 6px; background: var(--sheet); border-top: 1px solid var(--border-2); border-radius: 20px 20px 0 0; box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); }
.handle { width: 36px; height: 4px; margin: 2px auto 14px; background: var(--border-2); border-radius: 2px; }
.sheet h2 { margin: 0 4px 2px; font-size: 17px; font-weight: 600; }
.sheet p { margin: 0 4px 2px; color: var(--muted); font-size: 13px; }
.label { padding: 14px 6px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.ws-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; }
.ws-row .ic { color: var(--muted); }
.ws-row.active { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--border-2); }
.ws-row.active .ic { color: var(--accent-2); }
.ws-path { margin-left: auto; color: var(--faint); font: 11px var(--mono); }
.acc-card { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
.acc-card.disabled { opacity: .5; }
.acc-text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.acc-top { display: flex; align-items: center; gap: 7px; }
.acc-name { font-weight: 600; }
.acc-sub { color: var(--muted); font-size: 12.5px; }

/* history */
.seg { display: flex; margin: 2px 2px 4px; padding: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
.seg span { display: grid; flex: 1; place-items: center; height: 30px; color: var(--muted); font-size: 12.5px; border-radius: 8px; }
.seg .on { color: var(--text); background: var(--hover); box-shadow: inset 0 0 0 1px var(--border-2); }
.hist-project { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 8px 7px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
.hist-project .ic { color: var(--muted); }
.hist-name { color: var(--text); font-size: 13px; font-weight: 600; }
.hist-path { flex: 1; color: var(--faint); font: 11px var(--mono); }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 10px; }
.hist-text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.hist-title { font-weight: 500; }
.hist-sub { color: var(--muted); font-size: 12px; }

/* connect */
.connect { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px 22px; background: radial-gradient(620px 380px at 50% -8%, rgba(224, 122, 95, .12), transparent 62%), var(--side); }
.hero { text-align: center; }
.hero .logo { width: 66px; height: 66px; margin: 0 auto; border-radius: 19px; }
.hero h1 { margin: 18px 0 8px; font: 400 31px/1.2 var(--serif); letter-spacing: -.3px; }
.hero p { margin: 0 auto; max-width: 320px; color: var(--muted); font-size: 14px; }
.steps { width: 100%; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px; font-size: 13.5px; }
.num { display: inline-grid; flex: none; place-items: center; width: 24px; height: 24px; color: var(--accent-2); font: 600 11.5px var(--mono); background: rgba(224, 122, 95, .1); border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(224, 122, 95, .35); }
.btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btns .primary-btn, .btns .ghost-btn { width: 100%; height: 48px; }
.tip { margin: 0; max-width: 330px; color: var(--faint); font-size: 12px; text-align: center; }
.tip b { color: var(--muted); }

/* settings */
.group-head { padding: 14px 6px 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
.group { overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row > .ic { color: var(--muted); }
.row-text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.row-title { font-weight: 500; }
.row-sub { color: var(--muted); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.switch { position: relative; flex: none; width: 42px; height: 24px; background: var(--panel-2); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--border-2); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--muted); border-radius: 50%; }
.switch.on { background: var(--accent); box-shadow: none; }
.switch.on::after { left: 21px; background: #fff; }
.slider { position: relative; height: 18px; margin: 6px 0 2px; }
.slider::before { content: ''; position: absolute; top: 7px; right: 0; left: 0; height: 4px; background: var(--border-2); border-radius: 999px; }
.slider i { position: absolute; top: 7px; left: 0; width: 20%; height: 4px; background: var(--accent); border-radius: 999px; }
.slider b { position: absolute; top: 0; left: calc(20% - 9px); width: 18px; height: 18px; background: #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(224, 122, 95, .18); }
.danger-text { color: var(--red); font-weight: 500; }

/* style guide */
.guide { flex: 1; padding: 22px 20px; overflow: hidden; background: var(--side); }
.guide h2 { margin: 0 0 4px; font: 400 26px/1.2 var(--serif); letter-spacing: -.3px; }
.guide h3 { margin: 18px 0 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.guide > p { margin: 0; color: var(--muted); font-size: 12.5px; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sw { display: flex; flex-direction: column; gap: 3px; }
.sw i { display: block; height: 30px; border: 1px solid var(--border-2); border-radius: 8px; }
.sw span { font-size: 11.5px; font-weight: 600; }
.sw code { color: var(--faint); font: 10.5px var(--mono); }
.line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.dot-label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.type-serif { font: 400 22px/1.2 var(--serif); }
.type-title { font-size: 15px; font-weight: 600; }
.type-body { color: var(--muted); font-size: 13px; }
.type-mono { color: var(--muted); font: 12px var(--mono); }
</style>
</head>

<div class="board">

<!-- 1 · Agents -->

    <article class="card">
      <div class="card-top"><span class="dot on"></span><span class="avatar" data-agent="codex"></span><span class="card-title ellipsis">Cat rig walk cycle</span><span class="ago">now</span></div>
      <div class="card-sub indent ellipsis">Codex · main</div>

    <div class="section-head"><i data-ic="folder" data-size="15"></i><span>AgentArcade</span><span class="count">1</span></div>

function icon(name, size) {
  const filled = FILLED.includes(name);
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" ` +
    `stroke="${filled ? 'none' : 'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

const statusbar = '<div class="statusbar"><span>14:32</span><span class="sys">' +
  '<svg width="16" height="12" viewBox="0 0 16 12" fill="#ececf1"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.3" y="5.5" width="3" height="6.5" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>' +
  '<svg width="16" height="12" viewBox="0 0 24 18" fill="#ececf1"><path d="M12 18 0 4.5C3.2 1.7 7.4 0 12 0s8.8 1.7 12 4.5z"/></svg>' +
  '<svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="#ececf1" opacity=".6"/><rect x="2" y="2" width="14" height="8" rx="1.6" fill="#ececf1"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#ececf1" opacity=".6"/></svg>' +
  '</span></div>';

function nav(active) {
  const tabs = [['agents', 'terminal', 'Agents'], ['history', 'history', 'History'], ['settings', 'sliders', 'Settings']];
  return '<nav class="bottomnav">' + tabs.map(([id, ic, label]) =>
    `<span class="tab ${id === active ? 'on' : ''}"><span class="pill">${icon(ic, 20)}</span>${label}</span>`).join('') + '</nav>';
}

for (const el of document.querySelectorAll('[data-clone]')) {
  const source = document.getElementById(el.dataset.clone);
  el.innerHTML = source.innerHTML;
}
for (const el of document.querySelectorAll('[data-statusbar]')) {
  const style = el.getAttribute('style');
  el.outerHTML = style ? statusbar.replace('class="statusbar"', `class="statusbar" style="${style}"`) : statusbar;
}
for (const el of document.querySelectorAll('[data-nav]')) el.outerHTML = nav(el.dataset.nav);
for (const el of document.querySelectorAll('[data-ic]')) {
  const svg = icon(el.dataset.ic, Number(el.dataset.size) || 16);
  el.outerHTML = el.getAttribute('style') ? svg.replace('class="ic"', `class="ic" style="${el.getAttribute('style')}"`) : svg;
}
for (const el of document.querySelectorAll('[data-agent]')) {
  const cmd = el.dataset.agent;
  el.style.setProperty('--c', COLORS[cmd] || '#888');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${LOGOS[cmd]}"/></svg>`;
}

const screen = new URLSearchParams(location.search).get('s');
if (screen) {
  document.body.classList.add('single');
  document.getElementById(screen).closest('figure').classList.add('show');
}
</script>
</body>
</html>
